<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion — Espace Client Particuliers</title>
  <style>
    :root{
      --navy:#070a3a;
      --blue:#0b5cff;
      --text:#1f2430;
      --muted:#6b7280;
      --ring:#2f6df6;
      --bg:#ffffff;
      --shadow: 0 10px 30px rgba(0,0,0,.18);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* Top header */
    .topbar{
      height:88px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 0 18px;
      border-bottom:1px solid #eceef4;
      background:#fff;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width: 180px;
    }
    .sgmark{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:900;
      letter-spacing:-1px;
      font-size:54px;
      line-height:1;
    }
    .flag{
      width:160px;
      height:60px;
      background: linear-gradient(90deg,#e50019 0 45%, #0a0f2e 45% 100%);
      border-radius:0;
      margin-left:6px;
    }
    .open-account{
      background: var(--navy);
      color:#fff;
      border:none;
      padding: 14px 28px;
      border-radius:999px;
      font-size:18px;
      font-weight:600;
      box-shadow: 0 10px 22px rgba(7,10,58,.25);
      cursor:pointer;
      white-space:nowrap;
    }

    .content{
      position:relative;
      padding: 28px 18px 0;
      min-height: calc(100vh - 88px);
    }

    h1{
      text-align:center;
      margin: 18px 0 0;
      font-size: 26px;
      font-weight: 800;
      color:#5b5f66;
    }

    /* Right floating tools */
    .tools{
      position:absolute;
      right: 18px;
      top: 200px;
      width: 96px;
      height: 170px;
      background: var(--navy);
      border-radius: 4px;
      box-shadow: var(--shadow);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-evenly;
      padding: 18px 0;
    }
    .tool-btn{
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display:grid;
      place-items:center;
      color:#fff;
      background: transparent;
      border:1px solid rgba(255,255,255,.15);
    }
    .tool-line{
      width: 48px;
      height:2px;
      background: rgba(255,255,255,.35);
      margin: 4px 0;
      border-radius:2px;
    }

    /* Form */
    .form-wrap{
      margin: 120px auto 0;
      max-width: 560px;
      padding: 0 6px;
    }
    .label{
      font-size:20px;
      color:#6d6f78;
      margin: 0 0 14px;
      font-weight:500;
    }
    .input-row{
      position:relative;
    }
    input[type="text"],
    input[type="password"]{
      width: 100%;
      height: 64px;
      border: 3px solid var(--navy);
      border-radius: 8px;
      padding: 0 64px 0 18px;
      font-size:18px;
      outline:none;
      background:#fff;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus,
    input[type="password"]:focus{
      box-shadow: 0 0 0 4px rgba(47,109,246,.18);
      border-color: var(--blue);
    }
    .clear-x{
      position:absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border:none;
      background: transparent;
      color:#0a0a0a;
      font-size:30px;
      line-height:1;
      cursor:pointer;
      opacity:.85;
    }
    .clear-x:hover {
      opacity: 1;
    }

    .remember{
      margin-top: 20px;
      display:flex;
      align-items:center;
      gap:18px;
      color:#6d6f78;
      font-size:22px;
    }
    .info-badge{
      width: 22px;
      height: 22px;
      border-radius:50%;
      border:2px solid var(--blue);
      display:grid;
      place-items:center;
      font-weight:700;
      color: var(--blue);
      font-size:14px;
      margin-left:-8px;
    }

    /* Toggle switch */
    .switch{
      width: 58px;
      height: 34px;
      background: #7c7c7c;
      border-radius:999px;
      position:relative;
      border: 1px solid #6e6e6e;
      cursor:pointer;
      display:flex;
      align-items:center;
      padding: 4px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,.15);
    }
    .knob{
      width: 26px;
      height: 26px;
      border-radius:50%;
      background:#fff;
      box-shadow: 0 4px 10px rgba(0,0,0,.18);
      transform: translateX(0);
      transition: transform .18s ease;
    }
    .switch.on{
      background: #0e7dff;
      border-color: #0e7dff;
    }
    .switch.on .knob{
      transform: translateX(24px);
    }

    /* Red arc section placeholder at bottom */
    .red-arc{
      margin-top: 26px;
      height: 130px;
      background: linear-gradient(#ffffff 0%, #ffffff 22%, rgba(229,0,25,0) 22%),
                  radial-gradient(140% 130px at 50% 0%, #e50019 0%, #e50019 35%, rgba(229,0,25,0) 36%);
      pointer-events:none;
    }

    /* bottom meta bar */
    .footer-bar{
      position:fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 26px;
      width: min(620px, calc(100% - 28px));
      height: 60px;
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(6px);
      border:1px solid rgba(0,0,0,.06);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 0 18px;
      color:#4b5563;
      font-weight:600;
      box-shadow: 0 10px 22px rgba(0,0,0,.10);
      opacity:.95;
      user-select:none;
    }
    .footer-left{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .lock{
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: #f3f4f6;
      display:grid;
      place-items:center;
      font-size:12px;
      color:#6b7280;
    }
    .domain{
      font-size:15px;
    }
    .icons{
      display:flex;
      gap:14px;
      align-items:center;
      color:#6b7280;
      font-size:16px;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      padding: 16px;
      margin-top: 24px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .submit-btn:hover {
      background: var(--navy);
    }

    /* Responsive */
    @media (max-width: 480px){
      .topbar{height:78px}
      .sgmark{font-size:46px}
      .flag{width:120px}
      .tools{top: 180px; right: 10px; width: 84px;}
      .form-wrap{margin-top: 110px;}
      .remember{font-size:18px}
      input[type="text"], input[type="password"]{height:60px}
      .label{font-size:18px}
      .open-account{font-size:16px; padding: 12px 18px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="Marque">
      <div class="sgmark">
        <span>SG</span>
        <div class="flag" aria-hidden="true"></div>
      </div>
    </div>
    <button class="open-account">Ouvrir un compte</button>
  </header>

  <main class="content">
    <h1>Connexion à votre Espace Client Particuliers</h1>

    <aside class="tools" aria-label="Outils d’accessibilité">
      <div class="tool-btn" title="Message">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 15a4 4 0 0 1-4 4H8l-4 3V7a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v8Z" stroke="white" stroke-width="2" opacity=".95"/>
          <path d="M8 10h8" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="tool-line"></div>
      <div class="tool-btn" title="Calendrier">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 3v3M17 3v3" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <path d="M4 8h16" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <path d="M6 5h12a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" stroke="white" stroke-width="2"/>
          <path d="M8 12h.01M12 12h.01M16 12h.01" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
    </aside>

    <section class="form-wrap">
      <p class="label">Saisissez votre Identifiant Client</p>

      <div class="input-row">
        <input id="clientId" type="text" placeholder="" aria-label="Identifiant Client" />
        <button class="clear-x" id="clearBtn" aria-label="Effacer">×</button>
      </div>

      <p class="label" style="margin-top: 24px;">Mot de passe</p>
      <div class="input-row">
        <input id="password" type="password" placeholder="Entrez votre mot de passe" />
        <button class="clear-x" id="clearPassBtn" aria-label="Effacer">×</button>
      </div>

      <div class="remember">
        <span>Se souvenir de moi</span>
        <span class="info-badge" title="Aide">i</span>
        <div class="switch" id="toggle" role="switch" aria-checked="false" tabindex="0">
          <div class="knob"></div>
        </div>
      </div>

      <button class="submit-btn">Se connecter</button>

      <div class="red-arc" aria-hidden="true"></div>
    </section>

  </main>

  <div class="footer-bar" aria-hidden="true">
    <div class="footer-left">
      <div class="lock">🔒</div>
      <div class="domain">particuliers.sg.fr</div>
    </div>
    <div class="icons">
      <span>🔊</span>
      <span>↻</span>
    </div>
  </div>

  <script>
    const input = document.getElementById('clientId');
    const clearBtn = document.getElementById('clearBtn');
    const toggle = document.getElementById('toggle');

    // Clear ID
    clearBtn.addEventListener('click', () => input.value = '');
    
    // Clear Password (Added for completeness)
    const clearPassBtn = document.getElementById('clearPassBtn');
    const passwordInput = document.getElementById('password');
    clearPassBtn.addEventListener('click', () => passwordInput.value = '');

    const setToggle = (on) => {
      toggle.classList.toggle('on', on);
      toggle.setAttribute('aria-checked', on ? 'true' : 'false');
    };

    let on = false;
    setToggle(on);

    toggle.addEventListener('click', () => {
      on = !on;
      setToggle(on);
    });

    toggle.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        on = !on;
        setToggle(on);
      }
    });
  </script>
</body>
</html>
